[build]
  functions = "netlify/functions"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose"]
  included_files = ["netlify/functions/**", "data/**"]

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

# Redirect API calls to functions
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# NOTE: The SPA catch-all lives in public/_redirects (built into dist/), NOT here.
# A catch-all in netlify.toml is also applied by `netlify dev`, where it rewrites
# Vite's own module requests to /index.html and breaks the dev server. In dev,
# Vite already serves index.html for client-side routes, so no rule is needed.